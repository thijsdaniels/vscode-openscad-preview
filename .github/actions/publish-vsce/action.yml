name: Publish to VS Code Marketplace
description: Publish a packaged extension to the Visual Studio Marketplace. Skips when no token is provided.

inputs:
  vsix:
    description: Path to the packaged .vsix.
    required: true
  token:
    description: Personal access token (VSCE_PAT). When empty, publishing is skipped.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Publish
      if: inputs.token != ''
      run: npx @vscode/vsce publish -p "${{ inputs.token }}" --packagePath "${{ inputs.vsix }}"
      shell: bash

    - name: Skip Notification
      if: inputs.token == ''
      run: echo "Skipped publication because no VS Code Marketplace token was provided."
      shell: bash
