name: Build VSIX
description: Install dependencies and package the extension into a .vsix file.

inputs:
  output:
    description: Path to write the packaged .vsix to.
    required: false
    default: openscad-preview.vsix

outputs:
  vsix:
    description: Path to the packaged .vsix.
    value: ${{ inputs.output }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: "npm"

    - name: Install Dependencies
      run: npm ci
      shell: bash

    - name: Package Extension
      run: npx @vscode/vsce package -o "${{ inputs.output }}"
      shell: bash
