name: Publish to Open VSX
description: Publish a packaged extension to the Open VSX registry. Skips when no token is provided.

inputs:
  vsix:
    description: Path to the packaged .vsix.
    required: true
  token:
    description: Personal access token (OVSX_PAT). When empty, publishing is skipped.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Publish
      if: inputs.token != ''
      run: npx ovsx publish -p "${{ inputs.token }}" --packagePath "${{ inputs.vsix }}"
      shell: bash

    - name: Skip Notification
      if: inputs.token == ''
      run: echo "Skipped publication because no Open VSX token was provided."
      shell: bash
