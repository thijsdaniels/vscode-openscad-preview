name: Release

# Runs on every push to main and releases whenever package.json carries a
# version that has not been tagged yet — whether that bump came from merging the
# Changesets "Release" PR (see version.yml) or from a hand-edited package.json +
# CHANGELOG. Also dispatchable manually to retry a release that failed early.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_new_version: ${{ steps.check.outputs.is_new_version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Read Version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if Version Exists
        id: check
        run: |
          if git ls-remote --tags origin | grep -qE "refs/tags/v${{ steps.version.outputs.version }}(\^|$)"; then
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.is_new_version == 'true'
        uses: ./.github/actions/create-github-release
        with:
          version: ${{ steps.version.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Skipped Release
        if: steps.check.outputs.is_new_version != 'true'
        run: echo "v${{ steps.version.outputs.version }} is already released — nothing to publish."

  publish:
    name: Publish
    needs: release
    if: needs.release.outputs.is_new_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Build VSIX
        id: build
        uses: ./.github/actions/build-vsix

      - name: Upload Release Asset
        uses: ./.github/actions/upload-release-asset
        with:
          version: ${{ needs.release.outputs.version }}
          asset: ${{ steps.build.outputs.vsix }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace
        uses: ./.github/actions/publish-vsce
        with:
          vsix: ${{ steps.build.outputs.vsix }}
          token: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        uses: ./.github/actions/publish-ovsx
        with:
          vsix: ${{ steps.build.outputs.vsix }}
          token: ${{ secrets.OVSX_PAT }}
