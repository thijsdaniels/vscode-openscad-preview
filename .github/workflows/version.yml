name: Version

# Keeps the Changesets "Release" PR up to date. Merging that PR is what bumps
# package.json and writes CHANGELOG.md. This workflow does not tag or publish —
# release.yml picks up the new version once it lands on main.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Update Release PR
        uses: changesets/action@v1
        with:
          commit: "chore(release): version packages"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
